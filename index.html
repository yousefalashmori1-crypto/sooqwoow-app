<head>

<style>

  nav { display:flex; gap:6px; overflow-x:auto; padding:8px 10px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:46px; z-index:4 }

  label { display:block; font-size:12.5px; color:var(--mut); margin-top:6px } .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px } .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px }

  #toast { position:fixed; bottom:14px; inset-inline:14px; margin:auto; max-width:520px; padding:12px 16px; border-radius:10px; background:var(--ink); color:var(--bg); z-index:20; display:none } #toast.err { background:var(--bad); color:#fff }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px } .kv div:nth-child(odd) { color:var(--mut) }
</style></head>
<body>
<header><b>سوق واو · المحاسبة</b><span id="who" class="mut" style="color:#fff9"></span></header>

<script type="module">

}

const table = (cols, rows, onClick) => h("div", { class: "tw" }, h("table", {},
  h("tr", {}, cols.map(([t, , n]) => h("th", { class: n ? "n" : "" }, t))),
  rows.map((r) => h("tr", { class: onClick ? "click" : "", onclick: onClick ? () => onClick(r) : null },
    cols.map(([, f, n]) => h("td", { class: n ? "n" : "" }, typeof f === "function" ? f(r) : n === "m" ? omr(r[f]) : r[f] ?? ""))))));

const STATUS = { new: ["جديد", ""], needs_review: ["يحتاج مراجعة", "r"], awaiting_payment: ["بانتظار التحويل", "y"], handed_to_carrier: ["عند شركة الشحن", ""], delivered: ["تم التسليم", "g"], returned: ["مرتجع", "y"], cancelled: ["ملغى", ""] };

const REASON = { payment_method_unknown: "بوابة الدفع غير معروفة", shipping_method_unmapped: "طريقة الشحن غير معروفة", province_missing: "المنطقة ناقصة", country_missing: "الدولة ناقصة", outside_oman: "خارج عُمان", shipping_charged_above_free_threshold: "شحن مدفوع رغم أن الطلب ≥ 25 (شحن مجاني)", free_shipping_below_threshold: "شحن مجاني رغم أن الطلب < 25" };

// ---------- shell ----------
const PAGES = [["home", "الرئيسية"], ["orders", "الطلبات"], ["vouchers", "السندات"], ["statements", "كشوف الحساب"], ["purchases", "المشتريات"], ["stock", "المخزون"], ["settle", "تسوية الشحن"], ["reports", "التقارير"], ["settings", "الإعدادات"]];
const view = { home, orders, vouchers, statements, purchases, stock, settle, reports, settings };
function logout() { token = null; sessionStorage.removeItem("t"); $("#nav").hidden = true; $("#out").hidden = true; $("#who").textContent = ""; showLogin(); }

function nav() {
  const n = $("#nav"); n.hidden = false; n.replaceChildren(...PAGES.map(([k, t]) => h("a", { href: "#" + k, class: location.hash.slice(1) === k ? "on" : "" }, t)));

function showLogin() {
  const u = h("input", { placeholder: "اسم المستخدم", autocomplete: "username" }), p = h("input", { type: "password", placeholder: "كلمة المرور", autocomplete: "current-password" });

  const go = async () => {

// ---------- shared lookups ----------
const lk = {};
async function lookups(force) {

  }

}
const partyOpts = (kind) => lk.parties.filter((p) => !kind || p.kinds.includes(kind)).map((p) => [p.id, p.name]);

// ---------- home ----------
async function home() {
  const d = await api("GET", "/api/dashboard");
  return [
    card("أرصدة الصناديق", table([col("الصندوق", "name"), col("الرصيد", "balance", "m")], d.cashboxes)),
    card("أموال عند شركات الشحن", table([col("الشركة", "name"), col("لنا", "they_owe_us", "m"), col("علينا", "we_owe_them", "m")], d.carriers)),

}
const card = (t, ...c) => h("div", { class: "card" }, t && h("h2", {}, t), c);

// ---------- orders ----------
let ordFilter = "";

  const list = await api("GET", "/api/orders" + (ordFilter ? "?status=" + ordFilter : ""));

    card("إضافة طلبات يدويًا (ملف)", howto, h("div", { class: "row" }, field("ملف الطلبات", file)), h("div", { class: "bar" }, imp)), card("الطلبات", chips, q, body), detail];
}
async function openOrder(id, box) {
  const [d, , ] = await Promise.all([api("GET", `/api/orders/${id}`), lookups()]);

      h("div", { class: "row" }, field("الشركة", cr), field("AWB", awb), o.payment_method === "gateway" && field("رسوم البوابة", gf)),
      h("div", { class: "bar" }, act1("تسليم للشركة", () => api("POST", `/api/orders/${id}/handover`, { carrierId: cr.value ? Number(cr.value) : undefined, awb: awb.value || undefined, date: today(), gatewayFee: gf.value ? parseOmr(gf.value) : undefined })),

    forms.push(h("h3", {}, "مرتجع كامل"), lines.length && o.sale_entry_id ? h("div", {}, h("div", { class: "mut" }, "كمية التالف من كل صنف (لا تعود للمخزون):"),
      lines.map((l, i) => h("div", { class: "bar" }, h("span", {}, `${l.title} × ${l.qty}`), dmg[i]))) : null,

      h("div", {}, "الدفع"), h("div", {}, PAY[o.payment_method] ?? "—"), h("div", {}, "الإجمالي"), h("div", {}, `${omr(o.goods_total)} + شحن ${omr(o.shipping_charged)} = ${omr(total)}`),
      o.awb && [h("div", {}, "AWB"), h("div", {}, o.awb)], o.carrier_cost != null && [h("div", {}, "تكلفة الشحن علينا"), h("div", {}, omr(o.carrier_cost))],

}

// ---------- vouchers ----------

  const kind = sel("k", [["receipt", "سند قبض"], ["payment", "سند صرف (مورد/شركة شحن)"], ["expense", "مصروف"], ["transfer", "تحويل بين الصناديق"]], "receipt");

// ---------- automatic order pull (through the free relay) ----------
async function pullOrders() {
  let url = "", key = ""; try { url = localStorage.getItem("relayUrl") ?? ""; key = localStorage.getItem("relayKey") ?? ""; } catch {}
  if (!url || !key) throw new Error("أدخل رابط الوسيط والمفتاح أولًا");
  const r = await fetch(url.replace(/\/$/, "") + "/?days=14", { headers: { authorization: "Bearer " + key } });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error ?? "فشل الاتصال بالوسيط (" + r.status + ")");
  return api("POST", "/api/orders/import", { orders: j.orders });
}
const autoPull = async () => { try { if (!localStorage.getItem("relayUrl")) return; const r = await pullOrders(); if (r.added) { toast(`وصل ${r.added} طلب جديد من Shopify`); if (["orders", "home"].includes(location.hash.slice(1) || "home")) route(); } } catch (e) { /* offline: try again later */ } };
setInterval(() => backend && autoPull(), 300000);

// ---------- boot ----------
(async () => {
  try {
    backend = await createBackend(idbStorage());
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
    route(); autoPull();
  } catch (e) { $("#main").replaceChildren(h("div", { class: "card bad" }, "تعذّر فتح التخزين: " + e.message)); }
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
